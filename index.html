    html = `${sheetHead('퍼스널 컬러', sheetState.back)}
      <p class="group-title">내 유형을 골라 주세요</p>
      <div class="pc-cards" role="radiogroup" aria-label="퍼스널 컬러 유형">${PC_KEYS.map(k => pcCardHtml(k, pc.type === k, 'data-pc-pick')).join('')}</div>
      <button type="button" class="btn-soft" data-sheet="diag">잘 모르겠어요 · 진단하기</button>
      ${pc.type ? '<button type="button" class="btn-soft" data-sheet="pc-clear">설정 해제</button>' : ''}`;
  } else if (v === 'diag') {
    html = `${sheetHead('퍼스널 컬러 진단', sheetState.back)}
      <p class="group-title">6개 문항에 답해 주세요. 사진이나 카메라는 쓰지 않아요.</p>
      <div class="group">${DIAG_Q.map((q, i) => `<div class="q row col" role="radiogroup" aria-labelledby="q${i}"><p class="q-t" id="q${i}">${i + 1}. ${q[0]}</p><div class="q-opts">${[[1, q[1]], [-1, q[2]], [0, '모르겠어요']].map(([val, t]) => `<button type="button" role="radio" data-q="${i}" data-v="${val}" aria-checked="${sheetState.answers[i] === val}">${t}</button>`).join('')}</div></div>`).join('')}</div>
      <button type="button" class="btn-primary" id="diagGo" data-sheet="result" ${sheetState.answers.every(a => a !== null) ? '' : 'disabled'}>결과 보기</button>`;
  } else if (v === 'result') {
    const r = diagnose(sheetState.answers), c = r.candidates;
    if (c.length === 1) {
      const t = PC_TYPES[c[0]];
      html = `${sheetHead('진단 결과', true)}
        <div class="group result"><p class="footnote">나의 퍼스널 컬러는</p><h3>${t.name}</h3><div class="pal-chips" aria-hidden="true">${t.rep.map(x => `<i style="background:${x}"></i>`).join('')}</div><p>${t.desc}</p><p>피하는 방향: ${t.avoid}</p></div>
        <p class="footnote" style="margin:0 16px 12px">자가 진단은 참고용이에요.</p>
        <button type="button" class="btn-primary" data-pc-save="${c[0]}">이 유형으로 저장</button>
        <button type="button" class="btn-soft" data-sheet="diag">다시 진단하기</button>`;
    } else if (c.length === 2) {
      html = `${sheetHead('진단 결과', true)}
        <p class="group-title">점수가 애매해요. 둘 중 더 끌리는 쪽을 골라 주세요.</p>
        <div class="pc-cards" role="group" aria-label="후보 유형">${c.map(k => pcCardHtml(k, false, 'data-pc-save')).join('')}</div>
        <p class="footnote" style="margin:8px 16px">자가 진단은 참고용이에요.</p>`;
    } else {
      html = `${sheetHead('진단 결과', true)}
        <p class="group-title">두 축 모두 애매해요. 4유형 중에서 직접 골라 주세요.</p>
        <div class="pc-cards" role="group" aria-label="퍼스널 컬러 유형">${PC_KEYS.map(k => pcCardHtml(k, false, 'data-pc-save')).join('')}</div>
        <p class="footnote" style="margin:8px 16px">자가 진단은 참고용이에요.</p>`;
    }
  }
  sh.innerHTML = html;
}
/* 설정 시트가 열려 있을 때는 다시 그리지 않고 값만 갱신해서 포커스와 슬라이더 드래그를 지킨다 */
function syncSettings() {
  if (!sheetState.open || sheetState.view !== 'settings') return;
  const g = state.avatar.gender, seg = $('#setGender');
  if (!seg) return;
  seg.style.setProperty('--i', g === 'female' ? 1 : 0); seg.classList.toggle('none', !g);
  $$('[data-set-gender]', seg).forEach(b => b.setAttribute('aria-checked', b.dataset.setGender === g));
  $('#pcRowBtn').textContent = state.pc.type ? PC_TYPES[state.pc.type].name : '설정 안 함';
  const swd = $('#swDark'); if (swd) swd.setAttribute('aria-checked', themeNow() === 'dark');
  const sw = $('#swMine'); sw.disabled = !state.pc.type; sw.setAttribute('aria-checked', state.pc.onlyMine !== false);
  $('#offVal').textContent = fmtOff(state.profile.offset); $('#offRange').value = state.profile.offset;
  $('#hitLine').textContent = `"딱 좋았어요" 적중 ${state.profile.hits}회`;
}
function sheetGo(view, back) {
  sheetState.view = view; sheetState.back = back || null;
  if (view === 'diag') sheetState.answers = [null, null, null, null, null, null];
  renderSheet(); focusSheet();
}
function afterPcSaved() { if (sheetState.origin === 'settings') sheetGo('settings'); else closeSheet(); }
/* 성별·퍼스널 컬러만 지운다 (8.3). 토스트에서 되돌릴 수 있다 */
function resetMe() {
  const prev = { avatar: Object.assign({}, state.avatar), pc: Object.assign({}, state.pc) };
  state.avatar = { gender: null, skipped: false }; saveAvatar();
  state.pc = { type: null, source: null, onlyMine: true, skipped: false }; savePC();
  if (state.data) render();
  syncSettings();
  toast('체형과 퍼스널 컬러를 초기화했어요', { action: { label: '되돌리기', fn: () => { state.avatar = prev.avatar; saveAvatar(); state.pc = prev.pc; savePC(); if (state.data) render(); syncSettings(); } } });
}
function initSheet() {
  const sh = $('#sheet');
  $('#btnSettings').addEventListener('click', e => openSheet('settings', e.currentTarget));
  $('#btnTheme').addEventListener('click', toggleTheme);
  if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', syncThemeUi);
  $('#sheetBackdrop').addEventListener('mousedown', closeSheet);
  /* 그래버와 제목 줄을 아래로 끌어 시트를 닫는다 (P1) */
  let drag = null;
  sh.addEventListener('pointerdown', e => {
    if (e.button > 0 || !e.target.closest('.grabber,.sheet-head') || e.target.closest('button')) return;
    drag = { y: e.clientY, dy: 0, t: performance.now(), id: e.pointerId };
    try { sh.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    sh.style.transition = 'none';
  });
  sh.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dy = Math.max(0, e.clientY - drag.y);
    sh.style.transform = `translate(-50%, ${drag.dy}px)`;
  });
  const dragEnd = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    sh.style.transition = ''; sh.style.transform = '';
    if (d.dy > 96 || (d.dy > 30 && d.dy / Math.max(1, performance.now() - d.t) > .5)) closeSheet();
  };
  sh.addEventListener('pointerup', dragEnd); sh.addEventListener('pointercancel', dragEnd);
  sh.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const s = b.dataset.sheet;
    if (s === 'close') closeSheet();
    else if (s === 'back') sheetGo(sheetState.back || 'settings', null);
    else if (s === 'pc') sheetGo('pc', sheetState.view === 'settings' ? 'settings' : null);
    else if (s === 'diag') sheetGo('diag', sheetState.view === 'pc' ? 'pc' : null);
    else if (s === 'result') sheetGo('result', 'diag');
    else if (s === 'pc-clear') { clearPc(); afterPcSaved(); }
    else if (b.dataset.themeSw != null) toggleTheme();
    else if (s === 'reset-me') resetMe();
    else if (s === 'reset-offset') { state.profile.offset = 0; saveProfile(); if (state.data) render(); syncSettings(); }
    else if (b.dataset.setGender) setGender(b.dataset.setGender);
    else if (b.dataset.onlymineSw != null) toggleOnlyMine();
    else if (b.dataset.pcPick) { setPc(b.dataset.pcPick, 'manual'); afterPcSaved(); }
    else if (b.dataset.pcSave) { setPc(b.dataset.pcSave, 'diagnosis'); afterPcSaved(); }
    else if (b.dataset.q != null) {
      const i = +b.dataset.q; sheetState.answers[i] = +b.dataset.v;
      $$(`[data-q="${i}"]`, sh).forEach(x => x.setAttribute('aria-checked', x === b));
      $('#diagGo').disabled = !sheetState.answers.every(a => a !== null);
    }
  });
  sh.addEventListener('input', e => {
    if (e.target.id !== 'offRange') return;
    state.profile.offset = clamp(parseFloat(e.target.value) || 0, -6, 6);
    saveProfile(); syncSettings(); if (state.data) render();
  });
  document.addEventListener('keydown', e => {
    if (!sheetState.open) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.target.closest && e.target.closest('#setGender') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); setGender(state.avatar.gender === 'male' ? 'female' : 'male'); return; }
    if (e.key !== 'Tab') return;
    const f = $$('button,input,[tabindex="-1"]', sh).filter(x => !x.disabled && !x.hidden && (x.tabIndex >= 0 || x === document.activeElement) && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!sh.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

/* ---------- 탭 ---------- */
function setTab(t, focus) {
  if (t === state.tab) return;
  state.tab = t;
  $$('.tab').forEach(b => { const on = b.dataset.tab === t; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); });
  $('.tabs').style.setProperty('--i', ['today', 'tomorrow', 'week'].indexOf(t));
  $('#view').setAttribute('aria-labelledby', 'tab-' + t);
  if (!state.data) return;
  const view = $('#view');
  if (reducedMotion()) { render(); return; }
  view.classList.add('fading');
  setTimeout(() => { render(); view.classList.remove('fading'); }, 200);
}

function initTabs() {
  const tabs = $$('.tab');
  tabs.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('.tabs').addEventListener('keydown', e => {
    const i = tabs.findIndex(b => b.dataset.tab === state.tab);
    if (e.key === 'ArrowRight') { e.preventDefault(); setTab(tabs[(i + 1) % 3].dataset.tab, true); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); setTab(tabs[(i + 2) % 3].dataset.tab, true); }
  });
}

/* ---------- 이벤트 위임 ---------- */
function initEvents() {
  $('#outfitCard').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const D = b.dataset;
    if (D.style) { if (state.style !== D.style) { state.style = D.style; renderOutfit(); } }
    else if (D.slot) { state.sel[D.slot] = +D.i; state.hl = [D.slot]; renderOutfit(); }
    else if (D.avGender) setGender(D.avGender);
    else if (D.avPick) setGender(D.avPick);
    else if (D.av === 'skip') { state.avatar = { gender: null, skipped: true }; saveAvatar(); renderOutfit(); }
    else if (D.av === 'add') { state.avatar = { gender: null, skipped: false }; saveAvatar(); renderOutfit(); }
    else if (D.pcPick) setPc(D.pcPick, 'manual');
    else if (D.pc === 'skip') { state.pc = { type: null, source: null, onlyMine: true, skipped: true }; savePC(); renderOutfit(); }
    else if (D.sheetOpen) openSheet(D.sheetOpen, b);
    else if (D.accSw != null) { state.accOn = !state.accOn; renderOutfit(); }
    else if (D.outerSw != null) { state.outerOn = !state.outerOn; state.outerSrc = 'manual'; renderOutfit(); }
    else if (D.onlymineSw != null) toggleOnlyMine();
    else if (D.slotChip) {
      /* 같은 칩을 다시 누르면 선택이 풀리고 기본(입음)으로. 수동 상태에서 칩을 누르면 시간대 자동 판정으로 돌아간다 */
      if (state.outerSrc === 'slot' && state.slot === D.slotChip) { state.slot = null; state.outerSrc = 'default'; state.outerOn = true; }
      else { state.slot = D.slotChip; state.outerSrc = 'slot'; }
      renderOutfit();
    }
    else if (D.pal != null) { state.pal.sel = +D.pal; renderOutfit(); }
    else if (D.act === 'shuffle') shufflePalettes();
    else if (D.act === 'save') saveCurrent();
  });
  $('#outfitCard').addEventListener('keydown', e => {
    if (!e.target.closest || !e.target.closest('.av-seg') || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    setGender(state.avatar.gender === 'male' ? 'female' : 'male');
  });
  $('#feedbackBanner').addEventListener('click', e => { const b = e.target.closest('button[data-fb]'); if (b) giveFeedback(b.dataset.fb); });
  $('#closetCard').addEventListener('click', e => {
    const b = e.target.closest('button[data-del]');
    if (!b) return;
    state.closet.splice(+b.dataset.del, 1);
    saveClosetData();
    renderCloset();
    if (state.data && state.tab !== 'week') renderOutfit();
  });
  /* 보관함 스와이프 삭제 (P1): 왼쪽으로 밀면 빨간 "삭제"가 나오고, ✕ 버튼은 그대로 쓸 수 있다 */
  const SWIPE = 88;
  let swp = null;
  const closeSwipes = keep => $$('.closet-item.open', $('#closetCard')).forEach(li => { if (li !== keep) { li.classList.remove('open'); li.style.transform = ''; } });
  $('#closetCard').addEventListener('pointerdown', e => {
    const li = e.target.closest('.closet-item');
    if (!li) { closeSwipes(); return; }
    if (e.target.closest('button') || e.button > 0) return;
    closeSwipes(li);
    swp = { li, x: e.clientX, y: e.clientY, base: li.classList.contains('open') ? -SWIPE : 0, cur: 0, on: false, id: e.pointerId };
  });
  $('#closetCard').addEventListener('pointermove', e => {
    if (!swp || e.pointerId !== swp.id) return;
    const dx = e.clientX - swp.x, dy = e.clientY - swp.y;
    if (!swp.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swp = null; return; }
      if (Math.abs(dx) < 8) return;
      swp.on = true; swp.li.style.transition = 'none';
      try { swp.li.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    }
    swp.cur = clamp(swp.base + dx, -SWIPE - 24, 0);
    swp.li.style.transform = `translateX(${swp.cur}px)`;
  });
  const swipeEnd = e => {
    if (!swp || e.pointerId !== swp.id) return;
    const s = swp; swp = null;
    s.li.style.transition = '';
    if (!s.on) return;
    const open = s.cur < -SWIPE / 2;
    s.li.classList.toggle('open', open);
    s.li.style.transform = open ? `translateX(-${SWIPE}px)` : '';
  };
  $('#closetCard').addEventListener('pointerup', swipeEnd); $('#closetCard').addEventListener('pointercancel', swipeEnd);
  $('#emptyPanel').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.locate) locate();
    else if (b.dataset.city) { const p = PRESET_CITIES.find(c => c.n === b.dataset.city); if (p) loadCity({ name: p.n, lat: p.lat, lon: p.lon }); }
  });
  $('#btnLocate').addEventListener('click', locate);
}

function shufflePalettes() {
  const d = state.data, idx = dayIdx(), raw = d.days[idx];
  const info = withOffset(raw, state.profile.offset);
  const tier = tierOf(info.dayF), style = state.style;
  const wx = idx === 0 ? paletteWx(wxCat(d.current.code), !d.current.isDay) : paletteWx(wxCat(raw.code), false);
  const P = state.pal;
  P.round += 1;
  const ids = pickPalettes({ date: info.date, city: state.city.name, tier, style, wx, history: state.palHist, shown: P.shown, round: P.round, current: P.ids, pc: state.pc.type ? state.pc : null });
  P.shown = P.shown.concat(ids.filter(i => !P.shown.includes(i)));
  P.ids = ids; P.sel = 0;
  if (idx === 0) recordPaletteFirst(info.date, tier, style, ids[0]);
  renderOutfit();
}

/* ---------- 시작 ---------- */
function init() {
  if (/avatar-gallery/.test(location.search)) { avatarGallery(); return; }
  loadStored();
  syncThemeUi();
  initSearch(); initSheet(); initTabs(); initEvents();
  render();
  if (!Store.available) toast('이 브라우저에서는 저장이 안 돼요. 보관함과 피드백은 이 탭에서만 유지돼요', { duration: 6000 });
  locate();
}

init();
</script>
