<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script id="theme-boot">try{var t=JSON.parse(localStorage.getItem("theme"));if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Weather OOTD</title>
<meta name="description" content="체감온도에 맞는 오늘의 옷차림을 8단계로 추천하는 날씨 코디 앱">
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --fill:#f2f2f7; --ink:#1d1d1f; --ink-soft:#6e6e73;
  --line:rgba(60,60,67,0.12); --accent:#e2793d; --accent-ink:#a4501c; --accent-soft:rgba(226,121,61,0.14);
  --danger:#ff3b30; --success:#34c759;
  --radius-lg:20px; --radius-md:12px; --radius-sm:8px;
  --shadow-float:0 8px 32px rgba(0,0,0,0.12);
  --blur:saturate(180%) blur(20px);
  --glass:rgba(245,245,247,0.94);
  --ease:cubic-bezier(0.32,0.72,0,1);
  --on-accent:#ffffff;
  --hero-ink:#1d1d1f; --hero-soft:rgba(29,29,31,0.9); --hero-chip:rgba(255,255,255,0.72);
}
body[data-hero=dark]{--hero-ink:#ffffff; --hero-soft:rgba(255,255,255,0.95); --hero-chip:rgba(255,255,255,0.18)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-size:17px;line-height:22px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,.sw,.tab{transition:transform .1s ease-out,opacity .1s ease-out,background-color .25s var(--ease),color .25s var(--ease)}
button:active:not(:disabled){transform:scale(0.97);opacity:.85}
button:focus-visible,input:focus-visible,[role=option]:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}

/* 히어로 그라데이션: 상단에만, 채도를 20% 낮춰서 */
.hero-bg{position:absolute;top:0;left:0;right:0;height:520px;z-index:0;pointer-events:none;filter:saturate(.8);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.bg-layer{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.bg-layer.on{opacity:1}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* 헤더: 반투명 블러 고정 */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -16px;padding:8px 16px;background:transparent;color:var(--hero-ink);transition:background-color .25s var(--ease),color .25s var(--ease)}
.topbar.scrolled{background:var(--glass);color:var(--ink)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .topbar.scrolled{background:rgba(245,245,247,0.66);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
}
.logo{margin:0;font-size:17px;line-height:22px;font-weight:700;letter-spacing:-.01em}
.top-actions{display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:inherit}
.icon-btn:hover{background:rgba(0,0,0,.05)}
.icon-btn svg{width:24px;height:24px}

/* 검색창 */
.search{position:relative;padding:4px 0 8px}
.search input{width:100%;height:36px;border:0;border-radius:10px;padding:0 12px 0 36px;font:inherit;font-size:17px;background:rgba(242,242,247,.92);color:var(--ink)}
.search input::placeholder{color:var(--ink-soft)}
.search .mag{position:absolute;left:10px;top:13px;width:20px;height:20px;pointer-events:none;color:var(--ink-soft)}
#citySuggestions{position:absolute;left:0;right:0;top:48px;z-index:20;margin:0;padding:0;list-style:none;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-float);max-height:352px;overflow:auto}
#citySuggestions li[role=option]{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:10px 16px;cursor:pointer}
#citySuggestions li[role=option]+li::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
#citySuggestions li.active,#citySuggestions li[role=option]:hover{background:var(--fill)}
#citySuggestions .n{font-weight:600}
#citySuggestions .s{font-size:13px;line-height:18px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#citySuggestions .hint{padding:12px 16px;min-height:44px;color:var(--ink-soft);font-size:15px}

/* 세그먼트 컨트롤 (썸이 미끄러진다) */
.seg{--n:2;--i:0;position:relative;display:flex;height:32px;padding:2px;border-radius:9px;background:rgba(118,118,128,.12)}
.seg::before{content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);transform:translateX(calc(var(--i) * 100%));transition:transform .25s var(--ease),opacity .25s}
.seg.none::before{opacity:0}
.seg>button{position:relative;flex:1;min-width:0;border:0;background:transparent;border-radius:7px;padding:0 8px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink)}
.seg>button::before{content:"";position:absolute;inset:-6px 0}
.seg>button[aria-selected=true],.seg>button[aria-checked=true],.seg>button[aria-pressed=true]{font-weight:600}
.seg>button:active:not(:disabled){transform:none;opacity:.7}
.tabs{margin-bottom:12px;background:rgba(242,242,247,.9)}
.tabs .tab{font-size:15px}

/* 카드와 타이포 */
.card{background:var(--surface);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px}
.card h2{margin:0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.022em}
.footnote{font-size:13px;line-height:18px;color:var(--ink-soft)}
#view{transition:opacity .2s ease}
#view.fading{opacity:0}

/* 피드백 */
.fb-q{margin:0 0 12px;font-size:17px;font-weight:600}
.fb-btns{height:auto;padding:2px}
.fb-btns.seg::before{display:none}
.fb-btns>button{min-height:44px;font-size:15px}
.fb-btns>button:hover{background:#fff}

/* 날씨 히어로 */
.hero{padding:8px 4px 16px;color:var(--hero-ink)}
.hero .w-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.w-city{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.022em;overflow-wrap:anywhere}
.w-time{font-size:13px;line-height:18px;color:var(--hero-soft);white-space:nowrap}
.w-main{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin:4px 0 8px}
.w-emoji{font-size:56px;line-height:1}
.w-temp{font-size:96px;line-height:96px;font-weight:300;letter-spacing:-.022em}
.w-side{margin-left:auto;text-align:right}
.w-feels{font-size:15px;line-height:20px;font-weight:600}
.w-sum{font-size:15px;line-height:20px;color:var(--hero-soft)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.badge{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 10px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;background:var(--hero-chip);color:var(--hero-ink)}
.card .badge{background:var(--fill);color:var(--ink)}
.card .badge.warn{background:var(--accent-soft);color:var(--accent-ink)}
.umbrella{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:12px 16px;border-radius:var(--radius-md);background:rgba(255,255,255,.9);color:#1d1d1f}
.umbrella .u-ic{font-size:28px;line-height:1}
.umbrella b{display:block;font-size:17px;line-height:22px;font-weight:600}
.umbrella span:not(.u-ic){display:block;font-size:13px;line-height:18px;color:#48484a}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{text-align:center;padding:4px 8px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:17px;line-height:22px;font-weight:600}
.stat span{font-size:13px;line-height:18px;color:var(--ink-soft)}
.graph-title{margin:0 0 8px;font-size:17px;line-height:22px;font-weight:600}
.graph-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -8px;padding:0 8px}
.graph-wrap svg{display:block}

/* 코디 카드 */
.o-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.o-head .seg{width:152px}
.tier-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.tier-pill{display:inline-flex;align-items:center;min-height:24px;padding:2px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:13px;line-height:18px}
.o-desc{margin:0 0 12px;font-size:15px;line-height:20px;color:var(--ink-soft)}
.o-note{margin:0 0 12px;padding:12px 16px;border-radius:var(--radius-md);background:var(--fill);font-size:15px;line-height:20px;font-weight:500}
.feels-row{margin-bottom:16px}
.feels-row>button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:52px}
.feels-row{height:56px}
.feels-row>button span{font-size:12px;line-height:16px;font-weight:500;color:var(--ink-soft)}
.feels-row>button b{font-size:17px;line-height:22px;font-weight:600}
.slot-msg{margin:-8px 0 12px;font-size:13px;line-height:18px;color:var(--ink-soft);min-height:18px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--fill);border-radius:var(--radius-md);padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0;transition:opacity .3s var(--ease)}
.slot.is-off{opacity:.4}
.slot-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;color:var(--ink-soft);text-align:left;display:flex;justify-content:space-between;align-items:center;gap:4px}
.off-pill{padding:0 8px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;line-height:16px;letter-spacing:0}
.slot-icon{height:88px;display:grid;place-items:center}
.slot-icon svg{width:80px;height:80px}
.slot-icon .none{font-size:13px;line-height:18px;color:var(--ink-soft);padding:16px 8px}
.slot-name{font-weight:600;font-size:17px;line-height:22px;word-break:keep-all;overflow-wrap:break-word}
.slot-hint{font-size:13px;line-height:18px;color:var(--accent-ink);font-weight:500}
.alts{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.alt-chip{position:relative;min-height:32px;border:0;background:var(--surface);border-radius:16px;padding:0 12px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink)}
.alt-chip::before{content:"";position:absolute;inset:-6px -2px}
.alt-chip:hover{background:var(--accent-soft);color:var(--accent-ink)}
.pal-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:20px 0 8px}
.pal-title h3{margin:0;font-size:17px;line-height:22px;font-weight:600}
.pal-title small{display:block;font-size:13px;line-height:18px;font-weight:400;color:var(--ink-soft)}
.link-btn{position:relative;white-space:nowrap;min-height:32px;border:0;background:transparent;color:var(--accent-ink);font-weight:600;font-size:15px;line-height:20px;padding:0 4px}
.link-btn::before{content:"";position:absolute;inset:-6px -4px}
.btn-soft{min-height:44px;border:0;border-radius:var(--radius-md);padding:0 16px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:15px}
.pals{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.pals::-webkit-scrollbar{display:none}
.pal{flex:1 0 148px;max-width:200px;scroll-snap-align:start;border:0;background:var(--fill);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0;text-align:left}
.pal[aria-pressed=true]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.pal-name{font-size:15px;line-height:20px;font-weight:600;word-break:keep-all;overflow-wrap:break-word}
.pal[aria-pressed=true] .pal-name{color:var(--accent-ink)}
.pal[aria-pressed=true] .pal-name::before{content:"✓ "}
.pal-chips{display:flex}
.pal-chips i{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3px rgba(0,0,0,.1);margin-left:-6px}
.pal-chips i:first-child{margin-left:0}
.btn-primary{width:100%;height:50px;margin-top:16px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px}
.btn-primary.saved{background:var(--accent-soft);color:var(--accent-ink)}

/* 스위치 */
.sw{position:relative;flex:none;width:51px;height:31px;border:0;border-radius:16px;background:rgba(120,120,128,.32);padding:0}
.sw::before{content:"";position:absolute;inset:-7px -4px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.sw:disabled{opacity:.4}
.sw:active:not(:disabled){transform:none;opacity:1}

/* 주간 · 보관함: 인셋 그룹 리스트 */
.week-row{position:relative;display:grid;grid-template-columns:48px 32px 52px 36px 1fr 36px;align-items:center;gap:8px;min-height:48px;padding:6px 0;font-size:15px;line-height:20px}
.week-row+.week-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.week-row .day{font-weight:600}
.week-row .em{font-size:22px;text-align:center}
.week-row .pp{font-size:13px;line-height:18px;color:#0a5fa8;font-weight:500}
.week-row .lo{text-align:right;color:var(--ink-soft)}
.week-row .hi{font-weight:600}
.range{position:relative;height:6px;border-radius:99px;background:var(--fill)}
.range i{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#64b5f6,var(--accent))}
.closet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.closet-list{list-style:none;margin:0 -20px;padding:0}
.closet-item{position:relative;display:flex;gap:12px;align-items:center;min-height:64px;padding:12px 56px 12px 20px}
.closet-item+.closet-item::before{content:"";position:absolute;top:0;left:20px;right:0;height:1px;background:var(--line)}
.closet-main{min-width:0;flex:1}
.closet-av{flex:none;width:52px;height:104px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--fill)}
.tag.t{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.closet-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;line-height:18px;color:var(--ink-soft)}
.del{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;border-radius:50%;font-size:17px;color:var(--ink-soft)}
.del:active:not(:disabled){transform:translateY(-50%) scale(.97)}
.del:hover{background:var(--fill);color:var(--ink)}
.empty-note{color:var(--ink-soft);font-size:15px;line-height:20px;margin:0}

/* 빈 상태 */
.empty h2{margin-bottom:8px}
.empty p{margin:0 0 16px;color:var(--ink-soft);font-size:15px;line-height:20px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{min-height:44px;border:0;background:var(--fill);border-radius:999px;padding:0 16px;font-weight:600;font-size:15px}
.quick button:hover{background:var(--accent-soft);color:var(--accent-ink)}

/* 아바타 패널 */
.fit{display:grid;grid-template-columns:1fr;gap:12px}
.av-mount:empty,.av-mount[hidden]{display:none}
.av-panel{background:var(--fill);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:8px}
.av-top{display:flex;justify-content:flex-end}
.av-seg{width:132px}
.av-stage{height:300px;display:flex;justify-content:center}
.av-stage svg,.closet-av svg,.av-card-fig svg{display:block;height:100%;width:auto;max-width:100%}
.av-w{transition:opacity .2s var(--ease)}
.av-hl{animation:avhl .6s ease-out}
@keyframes avhl{0%{filter:drop-shadow(0 0 2.5px #e2793d) drop-shadow(0 0 1px #e2793d)}100%{filter:none}}
[data-layer=outer]{transform-box:view-box;transform-origin:100px 80px;transition:transform .3s var(--ease),opacity .3s var(--ease)}
[data-layer=outer].off{transform:translateY(8px) scaleX(1.04);opacity:0;pointer-events:none}
.av-pal{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;line-height:18px;font-weight:600;flex-wrap:wrap}
.av-outer{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:44px}
.av-outer label{font-size:15px;line-height:20px;font-weight:600}
.av-outer-msg{font-size:13px;line-height:18px;color:var(--ink-soft);flex:1 1 100%;min-width:0}
.av-outer-msg:empty{display:none}
.av-add{width:100%;min-height:44px;border:0;background:var(--fill);border-radius:var(--radius-md);font-weight:600;font-size:15px;color:var(--accent-ink)}
.av-choose{background:var(--fill);border-radius:var(--radius-md);padding:16px;text-align:center}
.av-choose-t{margin:0 0 12px}
.av-choose-t b{display:block;font-size:17px;line-height:22px;font-weight:600}
.av-choose-t span{font-size:13px;line-height:18px;color:var(--ink-soft)}
.av-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.av-card{border:0;background:var(--surface);border-radius:var(--radius-md);padding:8px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.av-card:hover{background:var(--accent-soft)}
.av-card-fig{display:block;height:200px}
.av-card b{font-size:17px;line-height:22px;font-weight:600}
.av-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.pc-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pc-card{border:0;background:var(--surface);border-radius:var(--radius-md);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.pc-card:hover{background:var(--accent-soft)}
.pc-card[aria-checked=true]{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.pc-card b{font-size:17px;line-height:22px;font-weight:600}
.pc-card span.d{font-size:13px;line-height:18px;color:var(--ink-soft)}
@media (min-width:420px){
  .fit.has-av{grid-template-columns:40% 1fr;align-items:start}
  .av-stage{height:auto;aspect-ratio:1/2}
}

/* 오버레이 */
.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(245,245,247,.6)}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;max-width:min(520px,calc(100vw - 32px));display:flex;align-items:center;gap:12px;background:rgba(29,29,31,.94);color:#fff;padding:12px 20px;border-radius:999px;box-shadow:var(--shadow-float);font-size:15px;line-height:20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:#ffb98c;font-weight:600;padding:0 4px;min-height:32px;white-space:nowrap}

/* 바텀 시트 */
.sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:100%;max-width:560px;max-height:90vh;overflow:auto;transform:translate(-50%,100%);background:#f2f2f7;border-radius:20px 20px 0 0;box-shadow:var(--shadow-float);padding:8px 16px calc(24px + env(safe-area-inset-bottom));transition:transform .35s var(--ease)}
.sheet.open{transform:translate(-50%,0)}
#sheetTitle:focus{outline:none}
.grabber{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:0 auto 8px}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:8px}
.sheet-head h2{margin:0;font-size:17px;line-height:22px;font-weight:600}
.sheet-head .link-btn{justify-self:start}
.sheet-head .link-btn:last-child{justify-self:end}
.group{background:var(--surface);border-radius:var(--radius-md);overflow:hidden;margin-bottom:16px}
.group-title{margin:0 16px 8px;font-size:13px;line-height:18px;color:var(--ink-soft);text-transform:none}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:8px 16px;font-size:17px;line-height:22px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row.col{flex-direction:column;align-items:stretch}
.row-btn{border:0;background:transparent;color:var(--ink-soft);font-size:17px;min-height:44px;padding:0 0 0 8px;display:flex;align-items:center;gap:4px}
.row-btn::after{content:"›";font-size:22px;color:rgba(60,60,67,.3)}
.off-val{font-size:34px;line-height:41px;font-weight:700;text-align:center;letter-spacing:-.022em;margin:4px 0}
.sheet input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.range-lab{display:flex;justify-content:space-between;font-size:13px;line-height:18px;color:var(--ink-soft)}
.hit-line{margin:8px 0 0;text-align:center;font-size:13px;line-height:18px;color:var(--ink-soft)}
.q{padding:12px 16px}
.q{position:relative;padding:12px 16px}
.q+.q::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.q-t{margin:0 0 8px;font-size:15px;line-height:20px;font-weight:600}
.q-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.q-opts button{min-height:44px;border:0;background:var(--fill);border-radius:var(--radius-sm);padding:4px 6px;font-size:13px;line-height:18px;font-weight:500}
.q-opts button[aria-checked=true]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;box-shadow:inset 0 0 0 2px var(--accent)}
.result{text-align:center;padding:16px}
.result h3{margin:0 0 4px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.022em}
.result .pal-chips{justify-content:center;margin:12px 0}
.result .pal-chips i{width:32px;height:32px}
.result p{margin:0 0 8px;font-size:15px;line-height:20px;color:var(--ink-soft)}
.sheet .btn-primary{margin-top:0}
.sheet .btn-soft{width:100%;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}
  .bg-layer{transition:none}
}
@media (max-width:380px){
  .w-temp{font-size:80px;line-height:80px}.w-emoji{font-size:44px}
  .week-row{grid-template-columns:40px 28px 46px 32px 1fr 32px;gap:6px}
  .o-head .seg{width:132px}
}

.own-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:4px;font-size:15px;line-height:20px;font-weight:500}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .sheet{background:rgba(242,242,247,0.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
}
/* --- PRD P1·P2: 스켈레톤, 스와이프 삭제, 시트 드래그, 제목 축소, 액세서리 스위치 --- */
.logo{display:grid;min-width:0;flex:1}
.logo>span{grid-area:1/1;min-width:0;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.logo .acc{color:var(--accent-ink)}
.logo-b{opacity:0;transform:translateY(8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.topbar.collapsed .logo-a{opacity:0;transform:translateY(-8px)}
.topbar.collapsed .logo-b{opacity:1;transform:none}
.topbar:not(.scrolled) .logo .acc{color:inherit}
#view.is-loading{opacity:.55;pointer-events:none}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--fill) 0%,rgba(127,127,127,.16) 50%,var(--fill) 100%);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.skel-sp{height:12px}
.skel-fit{display:grid;grid-template-columns:1fr;gap:12px}
.skel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:420px){.skel-fit{grid-template-columns:40% 1fr}}
.closet-list{overflow:hidden}
.closet-item{touch-action:pan-y;background:var(--surface);transition:transform .3s var(--ease)}
.swipe-act{position:absolute;top:0;bottom:0;left:100%;width:88px;border:0;border-radius:0;background:#d70015;color:#fff;font-weight:600;font-size:15px}
.swipe-act:active:not(:disabled){transform:none}
.grabber{position:relative}
.grabber::before{content:"";position:absolute;inset:-10px -40px}
.grabber,.sheet-head{touch-action:none}
.btn-soft.danger{background:var(--fill);color:#d70015}
.av-acc{margin-top:-4px}

/* --- 다크 모드 (UI4.7): 기본은 기기 설정을 따르고, 상단 버튼·설정 스위치로 켜고 끌 수 있다 (data-theme) --- */
:root[data-theme=light]{color-scheme:light}
@media (prefers-color-scheme:dark){
:root:not([data-theme=light]){color-scheme:dark;--bg:#000000; --surface:#1c1c1e; --fill:#2c2c2e; --ink:#f5f5f7; --ink-soft:#98989d; --line:rgba(84,84,88,.5); --accent-ink:#f5a36b; --accent-soft:rgba(226,121,61,.22); --danger:#ff453a; --success:#30d158; --shadow-float:0 8px 32px rgba(0,0,0,.5); --glass:rgba(0,0,0,.94); --hero-ink:#ffffff; --hero-soft:rgba(255,255,255,.95); --hero-chip:rgba(255,255,255,.18)}
:root:not([data-theme=light]) .hero-bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5)}
:root:not([data-theme=light]) .icon-btn:hover{background:rgba(255,255,255,.1)}
:root:not([data-theme=light]) .search input,:root:not([data-theme=light]) .tabs{background:var(--fill)}

:root:not([data-theme=light]) .seg::before{background:#636366;box-shadow:none}

:root:not([data-theme=light]) .week-row .pp{color:#64b5f6}
:root:not([data-theme=light]) .off-pill{color:var(--bg)}

:root:not([data-theme=light]) .loader{background:rgba(0,0,0,.5)}
:root:not([data-theme=light]) .sheet{background:#0b0b0d;box-shadow:0 -1px 0 rgba(255,255,255,.1),var(--shadow-float)}
:root:not([data-theme=light]) .sheet-backdrop{background:rgba(0,0,0,.55)}
:root:not([data-theme=light]) .grabber{background:rgba(235,235,245,.3)}
:root:not([data-theme=light]) .row-btn::after{color:rgba(235,235,245,.3)}
:root:not([data-theme=light]) .pal-chips i{box-shadow:0 0 0 2px var(--surface),0 0 0 3px rgba(255,255,255,.16)}
:root:not([data-theme=light]) .btn-soft.danger{color:#ff6961}
:root:not([data-theme=light]) .gx-t{fill:#98989d}
:root:not([data-theme=light]) .gx-v{fill:#f5f5f7}
:root:not([data-theme=light]) .gx-p{fill:#64b5f6}
:root:not([data-theme=light]) .gx-g{stroke:rgba(84,84,88,.5)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){:root:not([data-theme=light]) .topbar.scrolled{background:rgba(0,0,0,.6)}:root:not([data-theme=light]) .sheet{background:rgba(11,11,13,.9)}}
}
:root[data-theme=dark]{color-scheme:dark;--bg:#000000; --surface:#1c1c1e; --fill:#2c2c2e; --ink:#f5f5f7; --ink-soft:#98989d; --line:rgba(84,84,88,.5); --accent-ink:#f5a36b; --accent-soft:rgba(226,121,61,.22); --danger:#ff453a; --success:#30d158; --shadow-float:0 8px 32px rgba(0,0,0,.5); --glass:rgba(0,0,0,.94); --hero-ink:#ffffff; --hero-soft:rgba(255,255,255,.95); --hero-chip:rgba(255,255,255,.18)}
:root[data-theme=dark] .hero-bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.5)}
:root[data-theme=dark] .icon-btn:hover{background:rgba(255,255,255,.1)}
:root[data-theme=dark] .search input,:root[data-theme=dark] .tabs{background:var(--fill)}
:root[data-theme=dark] .seg{background:rgba(118,118,128,.36)}
:root[data-theme=dark] .seg::before{background:#636366;box-shadow:none}
:root[data-theme=dark] .fb-btns>button:hover{background:var(--surface)}
:root[data-theme=dark] .week-row .pp{color:#64b5f6}
:root[data-theme=dark] .off-pill{color:var(--bg)}
:root[data-theme=dark] .toast{background:rgba(58,58,60,.96)}
:root[data-theme=dark] .loader{background:rgba(0,0,0,.5)}
:root[data-theme=dark] .sheet{background:#0b0b0d;box-shadow:0 -1px 0 rgba(255,255,255,.1),var(--shadow-float)}
:root[data-theme=dark] .sheet-backdrop{background:rgba(0,0,0,.55)}
:root[data-theme=dark] .grabber{background:rgba(235,235,245,.3)}
:root[data-theme=dark] .row-btn::after{color:rgba(235,235,245,.3)}
:root[data-theme=dark] .pal-chips i{box-shadow:0 0 0 2px var(--surface),0 0 0 3px rgba(255,255,255,.16)}
:root[data-theme=dark] .btn-soft.danger{color:#ff6961}
:root[data-theme=dark] .gx-t{fill:#98989d}
:root[data-theme=dark] .gx-v{fill:#f5f5f7}
:root[data-theme=dark] .gx-p{fill:#64b5f6}
:root[data-theme=dark] .gx-g{stroke:rgba(84,84,88,.5)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){:root[data-theme=dark] .topbar.scrolled{background:rgba(0,0,0,.6)}:root[data-theme=dark] .sheet{background:rgba(11,11,13,.9)}}
</style>
</head>
<body>
<div class="hero-bg" aria-hidden="true"><div id="bgLayerA" class="bg-layer on"></div><div id="bgLayerB" class="bg-layer"></div></div>

<div class="app">
  <header class="topbar">
    <h1 class="logo"><span class="logo-a">Weather <span class="acc">OOTD</span></span><span class="logo-b" aria-hidden="true"></span></h1>
    <div class="top-actions">
      <button id="btnLocate" class="icon-btn" type="button" aria-label="현재 위치로 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4" fill="#e2793d" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
      </button>
      <button id="btnTheme" class="icon-btn" type="button" aria-pressed="false" aria-label="다크 모드 켜기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button id="btnSettings" class="icon-btn" type="button" aria-label="설정" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2" fill="#e2793d" stroke="none"/><circle cx="9" cy="17" r="2.2" fill="#e2793d" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <div class="search">
    <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="citySearch" type="text" placeholder="도시 검색 (예: 서울, Tokyo)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
      role="combobox" aria-label="도시 검색" aria-expanded="false" aria-controls="citySuggestions" aria-autocomplete="list">
    <ul id="citySuggestions" role="listbox" aria-label="도시 검색 결과" hidden></ul>
  </div>

  <div class="seg tabs" role="tablist" aria-label="날씨 보기" style="--n:3;--i:0">
    <button class="tab" role="tab" id="tab-today" data-tab="today" aria-selected="true" aria-controls="view" type="button">오늘</button>
    <button class="tab" role="tab" id="tab-tomorrow" data-tab="tomorrow" aria-selected="false" aria-controls="view" tabindex="-1" type="button">내일</button>
    <button class="tab" role="tab" id="tab-week" data-tab="week" aria-selected="false" aria-controls="view" tabindex="-1" type="button">주간 날씨</button>
  </div>

  <main id="view" role="tabpanel" aria-labelledby="tab-today">
    <section id="feedbackBanner" class="card" aria-label="추천 피드백" hidden></section>
    <div id="emptyPanel"></div>
    <div id="dayPanel" hidden>
      <section id="weatherHero" class="hero" aria-label="날씨"></section>
      <section id="weatherDetail" class="card" aria-label="날씨 상세"></section>
      <section id="graphCard" class="card" aria-label="24시간 그래프"></section>
      <section id="outfitCard" class="card" aria-label="코디 추천"></section>
    </div>
    <div id="weekPanel" hidden>
      <section id="weekCard" class="card" aria-label="주간 날씨"></section>
    </div>
  </main>

  <section id="closetCard" class="card" aria-label="보관함"></section>
</div>

<div id="loader" class="loader" role="status" aria-label="불러오는 중" hidden><div class="spinner"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>

<script>
'use strict';
/* ========================================================================
   Weather OOTD — 단일 파일 (HTML + CSS + Vanilla JS)
   ======================================================================== */

/* ---------- 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const pad2 = n => String(n).padStart(2, '0');
const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const fmtSigned = n => (n > 0 ? '+' : '') + (Math.round(n * 10) / 10) + '°';
const localDate = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const dayDiff = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5);
const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 다크 모드 켜기/끄기 ----------
   처음에는 기기 설정(prefers-color-scheme)을 따르고, 버튼을 누르면 선택을 저장해서(theme) 그 값을 우선한다. */
const mqDark = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const themeNow = () => document.documentElement.getAttribute('data-theme') || (mqDark && mqDark.matches ? 'dark' : 'light');
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg>';
function syncThemeUi() {
  const dark = themeNow() === 'dark', b = $('#btnTheme');
  if (b) { b.setAttribute('aria-pressed', dark); b.setAttribute('aria-label', dark ? '다크 모드 끄기' : '다크 모드 켜기'); b.innerHTML = dark ? ICON_SUN : ICON_MOON; }
  const sw = $('#swDark'); if (sw) sw.setAttribute('aria-checked', dark);
}
function toggleTheme() {
  const next = themeNow() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  Store.set('theme', next);
  syncThemeUi();
}

/* ---------- 저장소 (LocalStorage, 실패 시 메모리) ---------- */
const Store = (() => {
  let ok = true;
  const mem = {};
  try { localStorage.setItem('__ootd_probe', '1'); localStorage.removeItem('__ootd_probe'); } catch (e) { ok = false; }
  return {
    get available() { return ok; },
    get(key, fallback) {
      if (ok) {
        try { const v = localStorage.getItem(key); if (v != null) return JSON.parse(v); return fallback; } catch (e) { /* 손상된 값 → 메모리/기본값 */ }
      }
      return key in mem ? mem[key] : fallback;
    },
    set(key, val) {
      mem[key] = val;
      if (!ok) return;
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { ok = false; }
    }
  };
})();

/* ---------- 날씨 코드 (WMO) ---------- */
function wxCat(c) {
  if (c <= 1) return 'clear';
  if (c <= 3) return 'cloudy';
  if (c === 45 || c === 48) return 'fog';
  if (c >= 51 && c <= 57) return 'drizzle';
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if ((c >= 71 && c <= 77) || (c >= 85 && c <= 86)) return 'snow';
  if (c >= 95 && c <= 99) return 'thunder';
  return 'cloudy';
}
const WX_LABEL = { clear: '맑음', cloudy: '구름/흐림', fog: '안개', drizzle: '이슬비', rain: '비/소나기', snow: '눈', thunder: '뇌우' };
function wxEmoji(cat, code, night) {
  switch (cat) {
    case 'clear': return night ? '🌙' : '☀️';
    case 'cloudy': return night ? '☁️' : (code === 2 ? '⛅' : '☁️');
    case 'fog': return '🌫️';
    case 'drizzle': return '🌦️';
    case 'rain': return '🌧️';
    case 'snow': return '❄️';
    case 'thunder': return '⛈️';
  }
  return '☁️';
}
/* 팔레트 날씨 태그: clear | cloudy | rain | snow | night */
const paletteWx = (cat, night) => night ? 'night' : ({ clear: 'clear', cloudy: 'cloudy', fog: 'cloudy', drizzle: 'rain', rain: 'rain', thunder: 'rain', snow: 'snow' }[cat] || 'cloudy');

/* 배경 그라데이션 (날씨 × 낮/밤) */
const BG = {
  'clear-day': 'linear-gradient(160deg,#ffeccb 0%,#ffd7a1 48%,#f7bd8c 100%)',
  'clear-night': 'linear-gradient(160deg,#1f2b4d 0%,#3a3b66 55%,#57507a 100%)',
  'cloudy-day': 'linear-gradient(160deg,#e6e9ee 0%,#cdd5de 55%,#b9c4d0 100%)',
  'cloudy-night': 'linear-gradient(160deg,#2b3244 0%,#414a5f 60%,#566077 100%)',
  'fog-day': 'linear-gradient(160deg,#e2e1dc 0%,#cfcfca 60%,#bcbdb8 100%)',
  'fog-night': 'linear-gradient(160deg,#34373d 0%,#4a4d54 100%)',
  'rain-day': 'linear-gradient(160deg,#c3d0dc 0%,#a4b5c7 55%,#93a8bd 100%)',
  'rain-night': 'linear-gradient(160deg,#222b3a 0%,#38465b 60%,#4b5b72 100%)',
  'snow-day': 'linear-gradient(160deg,#f2f6fa 0%,#d9e4ef 55%,#c3d3e3 100%)',
  'snow-night': 'linear-gradient(160deg,#33415a 0%,#4d6082 60%,#5f7396 100%)',
  'thunder-day': 'linear-gradient(160deg,#7b7f96 0%,#565a72 100%)',
  'thunder-night': 'linear-gradient(160deg,#2d2f42 0%,#454863 100%)'
};
const DARK_BG = new Set(['clear-night', 'cloudy-night', 'fog-night', 'rain-night', 'snow-night', 'thunder-day', 'thunder-night']);
let bgFront = 'A', bgKey = '';
function setBackground(cat, night) {

const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
function matchPresets(q) {
  const k = norm(q);
  if (!k) return [];
  const hit = [];
  PRESET_CITIES.forEach(c => {
    const names = [c.n, ...c.a].map(norm);
    let score = -1;
    if (names.some(x => x === k)) score = 0;
    else if (names.some(x => x.startsWith(k))) score = 1;
    else if (names.some(x => x.includes(k))) score = 2;
    if (score >= 0) hit.push({ score, c });
  });
  return hit.sort((a, b) => a.score - b.score).map(h => ({ name: h.c.n, sub: h.c.co, lat: h.c.lat, lon: h.c.lon, preset: true }));
}

/* 5.2 스마트 아우터: 티어 0~3에서 일교차·아침저녁 저온이면 얇은 아우터를 강제 보강.
   info는 offset이 가산된 값이다. */
function getSmartOutfitSet(tier, style, info, seedKey, wx) {
  const base = TIERS[tier][style];
  const set = { top: base.top, bottom: base.bottom, outer: base.outer, acc: base.acc };
  const def = {};
  let note = null;
  if (tier <= 3 && !(info.minF >= 24)) {
    const range = info.maxF - info.minF;
    if (range >= 6 || info.minF <= 19) {
      set.outer = THIN_OUTER;
      const h = hash32(seedKey + '|thin')();
      def.outer = (wx === 'rain' || wx === 'snow') ? 1 : h % THIN_OUTER.length;
      note = range >= 6 ? '일교차가 커서 겉옷을 챙기세요' : '아침·저녁이 쌀쌀해서 얇은 겉옷을 챙기세요';
    }
  }
  return { set, def, note };
}

  male: { label: '남성형', r: 17.5, ry: 21, neckW: 18, shW: 88, chW: 80, waW: 66, hiW: 70, knW: 22, anW: 13, armW: [20, 16, 12, 13], armC: [33.5, 52, 58, 60], legC: [14, 12.5], foot: 30 },
  female: { label: '여성형', r: 16.5, ry: 20, neckW: 15, shW: 78, chW: 72, waW: 54, hiW: 74, knW: 20, anW: 11, armW: [17, 14, 11, 11.5], armC: [30, 47, 54, 56], legC: [13, 11.5], foot: 26 }
};
const AV_SKIN = '#e2c79f', AV_HAIR = '#3b2f2a';   /* 나무 마네킹 색 (머리카락은 없지만 실루엣 치환용으로 남겨 둔다) */
/* 뒤 → 앞 (PRD 5.1). scarf·gloves는 아우터와 얼굴 사이, prop(우산)은 맨 앞 */
const AV_LAYERS = ['hairB', 'body', 'shoes', 'bottom', 'top', 'outer', 'scarf', 'gloves', 'face', 'hairF', 'beanie', 'glasses', 'prop'];
/* 여유(e)는 몸통 폭 기준 한쪽 px. 아우터 여유는 상의보다 3px 이상 크게 잡는다. 소매 길이는 팔 anchor(팔꿈치·손목) 기준 */
const AV_CFG = {
  top: {
    sleeveless: { e: 4, sl: 0, neck: 'crew' }, tshirt_short: { e: 4, sl: 122, neck: 'crew' }, shirt_short: { e: 4, sl: 122, neck: 'collar' },
    tshirt_long: { e: 4, sl: 208, neck: 'crew' }, shirt_long: { e: 4, sl: 210, neck: 'collar', cuff: 4 }, sweatshirt: { e: 6, sl: 208, neck: 'crew', rib: 8 },
    knit: { e: 4, sl: 208, neck: 'v', rib: 6 }, turtleneck: { e: 4, sl: 208, neck: 'turtle' }, hoodie: { e: 6, sl: 208, neck: 'hood', rib: 8 }
  },
  /* fit = [허리, 골반, 허벅지, 무릎, 밑단] 구간별 여유(px). 허리·골반은 몸에 맞추고 상의 밑단 여유(4)보다 작게 둔다.
     와이드 팬츠는 허리가 아니라 허벅지부터 넓어진다. */
  bottom: {
    jeans: { fit: [2, 3.5, 3.5, 3, 3], hem: 374 }, slacks: { fit: [2, 3.5, 4, 3.5, 3], hem: 374 }, shorts: { fit: [2, 3.5, 5, 6, 6], hem: 254 },
    jogger: { fit: [2, 4, 5, 4.5, 1], hem: 366 }, wide: { fit: [2, 3.5, 8, 12, 15], hem: 380 }
  },
  outer: {
    shirt_long: { e: 7, hem: 216 }, blazer: { e: 6, hem: 222 }, cardigan: { e: 8, hem: 228 }, hoodie_zip: { e: 8, hem: 216 }, field_jacket: { e: 9, hem: 230 },
    coat: { e: 9, hem: 270, flare: .05 }, trench: { e: 9, hem: 270, flare: .05 }, puffy: { e: 14, hem: 218, closed: true, out: 6 }
  }

/* --- 기하 도우미 --- */
const f1 = n => Math.round(n * 10) / 10;
const rng = (a, b, s) => { const r = []; for (let y = a; y < b; y += s) r.push(y); r.push(b); return r; };
const PTS = pts => 'M' + pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join('L') + 'Z';
/* 그림체: 라인 없는 플랫 벡터. 검은 외곽선 대신 면 + 은은한 명암을 쓰고, 경계에는 같은 색조의 아주 얇은 가장자리(tonal edge)만 둔다 */
const AV_STYLE = { edge: -.34, edgeW: .8, edgeOp: .55, detail: -.24, detailW: .55, detailOp: .5 };
const stk = (d, c, w = .7, extra = '') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${Math.min(w, 2.6)}" stroke-linecap="round" stroke-linejoin="round"${extra}/>`;
const fil = (d, c, k) => `<path d="${d}" fill="${c}"${k ? ` stroke="${c === 'none' ? '#888' : shade(c, AV_STYLE.detail)}" stroke-opacity="${AV_STYLE.detailOp}" stroke-width="${AV_STYLE.detailW}" stroke-linejoin="round"` : ''}/>`;   /* 세 번째 인자는 '안쪽 선을 둘지'만 정한다 */
const dot = (x, y, r, c) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="${c}"/>`;
const lum = h => { const n = parseInt(h.slice(1), 16); return (.299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255)) / 255; };
function ipol(pts, y) {
  if (y <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (y <= pts[i][0]) {
      const a = pts[i - 1], b = pts[i], t = (y - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * (.5 * t + .25 * (1 - Math.cos(Math.PI * t)));
    }
  }
  return pts[pts.length - 1][1];
}
const avGeoms = {};
function avGeom(gender) {
  if (avGeoms[gender]) return avGeoms[gender];
  const T = AV_TPL[gender];
  const torso = [[AV_Y.neck, T.neckW / 2], [AV_Y.shoulder, T.shW / 2], [AV_Y.chest, T.chW / 2], [AV_Y.waist, T.waW / 2], [AV_Y.hip, T.hiW / 2], [AV_Y.crotch, T.hiW / 2 - 1.5]];
  const legW = [[AV_Y.crotch, T.hiW / 2 - 1.5], [AV_Y.knee, T.knW], [AV_Y.ankle, T.anW]];
  const legC = [[AV_Y.crotch, T.hiW / 4 - .75], [AV_Y.knee, T.legC[0]], [AV_Y.ankle, T.legC[1]]];
  const armC = AV_ARM_Y.map((y, i) => [y, T.armC[i]]), armW = AV_ARM_Y.map((y, i) => [y, T.armW[i]]);
  const g = { T, torso: y => ipol(torso, y), legW: y => ipol(legW, y), legC: y => ipol(legC, y), armC: y => ipol(armC, y), armW: y => ipol(armW, y) };
  /* 신체 anchor: 모든 옷은 이 점들에서 폭과 위치를 읽는다 (옷마다 따로 좌표를 갖지 않는다) */
  g.A = {
    neck: { x: 100, y: AV_Y.neck, halfW: T.neckW / 2 },
    neckC: { x: 100, y: AV_Y.neck }, neckL: { x: 100 - T.neckW / 2, y: AV_Y.neck }, neckR: { x: 100 + T.neckW / 2, y: AV_Y.neck },
    shoulderL: { x: 100 - T.shW / 2, y: AV_Y.shoulder }, shoulderR: { x: 100 + T.shW / 2, y: AV_Y.shoulder },
    chest: { x: 100, y: AV_Y.chest, halfW: T.chW / 2 },
    waist: { x: 100, y: AV_Y.waist, halfW: T.waW / 2 },
    hip: { x: 100, y: AV_Y.hip, halfW: T.hiW / 2 },
    hipL: { x: 100 - T.hiW / 2, y: AV_Y.hip }, hipR: { x: 100 + T.hiW / 2, y: AV_Y.hip },
    crotch: { x: 100, y: AV_Y.crotch },
    kneeL: { x: 100 - g.legC(AV_Y.knee), y: AV_Y.knee }, kneeR: { x: 100 + g.legC(AV_Y.knee), y: AV_Y.knee },
    ankleL: { x: 100 - g.legC(AV_Y.ankle), y: AV_Y.ankle }, ankleR: { x: 100 + g.legC(AV_Y.ankle), y: AV_Y.ankle },
    armRootL: { x: 100 - g.armC(AV_ARM_Y[0]), y: AV_ARM_Y[0] }, armRootR: { x: 100 + g.armC(AV_ARM_Y[0]), y: AV_ARM_Y[0] },
    elbowL: { x: 100 - g.armC(AV_ARM_Y[1]), y: AV_ARM_Y[1] }, elbowR: { x: 100 + g.armC(AV_ARM_Y[1]), y: AV_ARM_Y[1] },
    wristL: { x: 100 - g.armC(AV_ARM_Y[2]), y: AV_ARM_Y[2] }, wristR: { x: 100 + g.armC(AV_ARM_Y[2]), y: AV_ARM_Y[2] },
    head: { x: 100, y: AV_Y.head, r: T.r, ry: T.ry }
  };
  g.tip = e => g.A.shoulderR.x - 100 + e;   /* 어깨 끝점의 중심선 기준 반폭 (+여유) */
  return (avGeoms[gender] = g);
}


/* --- 그림체 v3 도우미: 얇은 실루엣 선 + 겹치는 반투명 명암 (그라디언트 id를 쓰지 않아서 어디에 놓여도 안전하다) --- */
const edgeA = c => ` stroke="${shade(c, AV_STYLE.edge)}" stroke-opacity="${AV_STYLE.edgeOp}" stroke-width="${AV_STYLE.edgeW}" stroke-linejoin="round"`;
const ov = (d, o, c = '#000') => `<path d="${d}" fill="${c}" opacity="${o}"/>`;
/* 형태를 따라가는 명암: 오른쪽 가장자리에 좁은 어두운 띠 2단(부드러운 감쇠), 왼쪽 가장자리에 아주 얇은 하이라이트 */
function formShade(fl, fr, ys, o = {}) {
  const w = y => fr(y) - fl(y), dk = o.dark == null ? .07 : o.dark, hl = o.light == null ? .12 : o.light;
  const strip = (a, b) => PTS(ys.map(y => [fl(y) + w(y) * a, y]).concat(ys.slice().reverse().map(y => [fl(y) + w(y) * b, y])));
  return (dk ? ov(strip(o.a || .87, 1), dk) + ov(strip(.95, 1), dk * .9) : '') + (hl ? ov(strip(0, .06), hl, '#fff') : '');
}
/* 밑단 안쪽 그림자: 밑단선 위 5px. 옷 안쪽에만 그려서 배경으로 번지지 않는다 */
function hemInner(x0, x1, hem, curve, o = .07, hgt = 5) {
  const top = [], bot = [];
  for (let i = 0; i <= 8; i++) { const t = i / 8, x = x0 + (x1 - x0) * t; top.push([x, hem - hgt]); bot.push([x, hem + curve * Math.sin(Math.PI * t)]); }
  return ov(PTS(top.concat(bot.reverse())), o);
}
/* 머리 윤곽: 정수리는 둥글고 턱으로 갈수록 좁아지는 계란형 (남성은 턱이 조금 각지고, 여성은 갸름하다) */
function headD(g, dx = 0, dr = 0, dy = 0) {
  /* 드로잉 마네킹의 머리: 이목구비 없는 달걀형 (위가 둥글고 턱 쪽이 살짝 좁다) */
  const h = g.A.head, rx = h.r + dr, ry = h.ry + dy, cx = 100 + dx, cy = h.y, P = (a, b) => f1(a) + ' ' + f1(b);
  return `M${P(cx, cy - ry)} C${P(cx + rx * .64, cy - ry)} ${P(cx + rx, cy - ry * .52)} ${P(cx + rx * .98, cy + ry * .04)} C${P(cx + rx * .95, cy + ry * .58)} ${P(cx + rx * .52, cy + ry)} ${P(cx, cy + ry)} C${P(cx - rx * .52, cy + ry)} ${P(cx - rx * .95, cy + ry * .58)} ${P(cx - rx * .98, cy + ry * .04)} C${P(cx - rx, cy - ry * .52)} ${P(cx - rx * .64, cy - ry)} ${P(cx, cy - ry)}Z`;
}


/* 손: 손목에서 이어져 손가락 쪽으로 좁아지는 길쭉한 형태 + 안쪽 엄지. grow는 장갑처럼 부풀릴 때 쓴다 */
function handD(cx, sg, w, grow = 0) {
  const X = v => f1(cx + sg * v), y0 = 214, t = grow;
  return `M${X(-w - t)} ${y0} C${X(-w - 1 - t)} ${y0 + 8} ${X(-w - 1.7 - t)} ${y0 + 15} ${X(-w - 1.1 - t)} ${y0 + 21} C${X(-w - .6 - t)} ${y0 + 26} ${X(-w + 2.4)} ${y0 + 29 + t} ${X(0)} ${y0 + 29 + t} C${X(w - 2.4)} ${y0 + 29 + t} ${X(w + .6 + t)} ${y0 + 26} ${X(w + 1.1 + t)} ${y0 + 21} C${X(w + 1.7 + t)} ${y0 + 15} ${X(w + 1 + t)} ${y0 + 8} ${X(w + t)} ${y0}Z`;
}
function thumbD(cx, sg, w, grow = 0) {
  const X = v => f1(cx + sg * v), y0 = 214, t = grow;
  return `M${X(-w + .6)} ${y0 + 5} C${X(-w - 3 - t)} ${y0 + 8} ${X(-w - 4.6 - t)} ${y0 + 14} ${X(-w - 3.6 - t)} ${y0 + 18.5} C${X(-w - 2.6)} ${y0 + 20.5} ${X(-w - .2)} ${y0 + 18} ${X(-w + .6)} ${y0 + 13}Z`;
}

/* 옷 조각: 왼쪽/오른쪽 윤곽 함수로 채우고, 밝은 면(왼쪽 위 광원) + 어두운 면 + 외곽선을 얹는다 */
function tube(fl, fr, y0, y1, color, o = {}) {
  const ys = rng(y0, y1, o.step || 5), bul = o.bulge == null ? 2.5 : o.bulge;
  const L = ys.map(y => [fl(y), y]), R = ys.map(y => [fr(y), y]).reverse();
  const bot = [], cap = [];
  for (let i = 1; i < 4; i++) bot.push([fl(y1) + (fr(y1) - fl(y1)) * i / 4, y1 + bul * Math.sin(Math.PI * i / 4)]);
  if (o.cap) { const h = (fr(y0) - fl(y0)) * .45; for (let i = 3; i >= 1; i--) cap.push([fl(y0) + (fr(y0) - fl(y0)) * i / 4, y0 - h * Math.sin(Math.PI * i / 4)]); }
  const d = PTS(L.concat(bot, R, cap));
  return fil(d, color) + (o.flat ? '' : formShade(fl, fr, ys, o.sh)) + `<path d="${d}" fill="none"${edgeA(color)}/>`;
}

const band = (fl, fr, y0, y1, color) => tube(fl, fr, y0, y1, color, { flat: true, bulge: 0, step: 4 });

/* 목선 좌표(오른쪽 목 끝 → 왼쪽 목 끝). depth만큼 파고, v면 V넥 */
function neckline(nw, depth, v) {
  const p = [];
  for (let i = 1; i < 7; i++) { const t = i / 7; p.push([100 + nw - 2 * nw * t, AV_Y.neck + (v ? depth * (1 - Math.abs(2 * t - 1)) : depth * Math.sin(Math.PI * t))]); }
  return p;
}
const shoulderPts = (nw, h80) => [0, 1, 2, 3, 4].map(i => [nw + (h80 - nw) * (1 - Math.cos(Math.PI * i / 4)) / 2, AV_Y.neck + (AV_Y.shoulder - AV_Y.neck) * i / 4]);

/* --- 몸 (피부, 외곽선 없음) --- */
function avBody(g) {
  /* 나무 드로잉 마네킹: 매끈한 마디(팔·다리 조각)와 관절 구슬. 옷이 읽는 몸통·팔·다리 윤곽(anchor)은 그대로다 */
  const T = g.T, S = AV_SKIN, nh = T.neckW / 2;
  const ball = (x, y, r) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${S}"/>` +
    `<circle cx="${f1(x + r * .3)}" cy="${f1(y + r * .3)}" r="${f1(r * .62)}" fill="#000" opacity=".045"/><ellipse cx="${f1(x - r * .3)}" cy="${f1(y - r * .34)}" rx="${f1(r * .36)}" ry="${f1(r * .3)}" fill="#fff" opacity=".3"/>` +
    `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="none" stroke="#5a4028" stroke-opacity=".32" stroke-width=".7"/>`;
  /* 목 */
  let s = fil(PTS([[100 - nh + .4, 42], [100 + nh - .4, 42], [100 + nh + .5, 60], [100 + nh + 4, AV_Y.neck + 6], [100 - nh - 4, AV_Y.neck + 6], [100 - nh - .5, 60]]), S);
  s += ov(PTS([[100 + nh * .3, 42], [100 + nh - .4, 42], [100 + nh + .5, 60], [100 + nh + 4, AV_Y.neck + 6], [100 + nh * .4, AV_Y.neck + 6]]), .07);
  s += stk(`M${100 - nh + .2} 57 Q100 60 ${100 + nh - .2} 57`, '#5a4028', .6, ' opacity=".3"');   /* 목 마디 이음선 */
  for (const sg of [-1, 1]) {
    const c = y => 100 + sg * g.armC(y), hw = y => g.armW(y) / 2, ys = rng(80, 216, 5), fl = y => c(y) - hw(y), fr = y => c(y) + hw(y);
    s += fil(PTS(ys.map(y => [fl(y), y]).concat(ys.slice().reverse().map(y => [fr(y), y]))), S) + formShade(fl, fr, ys, { dark: .07, light: .14 });
    const hx = c(216), w = hw(216);
    /* 손: 손가락을 나누지 않은 나무 장갑 모양 + 엄지 */
    s += fil(thumbD(hx, sg, w), S) + fil(handD(hx, sg, w), S) + ov(PTS([[hx + w * .3, 218], [hx + w + 1, 218], [hx + w + 1.4, 236], [hx + w * .3, 242]]), .06);
    s += stk(`M${f1(hx - w * .5)} 226 Q${f1(hx)} 228 ${f1(hx + w * .5)} 226`, '#5a4028', .55, ' opacity=".25"');
    s += ball(c(86), 86, hw(86) + .8) + ball(c(152), 152, hw(152) + .9) + ball(hx, 216, w + .7);
  }
  const ys = rng(AV_Y.neck, AV_Y.crotch, 6);
  s += fil(PTS(ys.map(y => [100 - g.torso(y), y]).concat(ys.slice().reverse().map(y => [100 + g.torso(y), y]))), S);
  for (const sg of [-1, 1]) {
    const yl = rng(AV_Y.crotch - 2, 374, 8), xa = y => 100 + sg * (g.legC(y) + g.legW(y) / 2), xb = y => 100 + sg * Math.max(.4, g.legC(y) - g.legW(y) / 2);
    const fl = sg < 0 ? xa : xb, fr = sg < 0 ? xb : xa;
    s += fil(PTS(yl.map(y => [xa(y), y]).concat(yl.slice().reverse().map(y => [xb(y), y]))), S) + formShade(fl, fr, yl, { dark: .07, light: .12 });
    s += ball(100 + sg * g.legC(AV_Y.knee), AV_Y.knee, g.legW(AV_Y.knee) / 2 + .3) + ball(100 + sg * g.legC(AV_Y.ankle), AV_Y.ankle, g.T.anW / 2 + .7);
  }
  return s;
}

function avFace(g) {
  /* 이목구비 없는 매끈한 달걀 머리. 얼굴을 그리지 않고, 입체를 알려 주는 옅은 십자 등고선(드로잉 마네킹의 기준선)만 둔다 */
  const h = g.A.head, rx = h.r, ry = h.ry, cy = h.y, S = AV_SKIN, ey = cy + 1;
  let s = `<path d="${headD(g)}" fill="${S}"/>` + ov(headD(g), .06) + `<path d="${headD(g, -1.5, -1.2, -.9)}" fill="${S}"/>`;
  s += ov(`M${f1(100 - rx * .5)} ${f1(cy - ry * .5)} q${f1(rx * .5)} -6 ${f1(rx)} 0 q-${f1(rx * .5)} 3.4 -${f1(rx)} 0z`, .22, '#fff');   /* 이마 하이라이트 */
  s += stk(`M100 ${f1(cy - ry + 1.6)} Q101.1 ${cy} 100 ${f1(cy + ry - .8)}`, '#5a4028', .5, ' opacity=".2"') + stk(`M${f1(100 - rx + 1.2)} ${ey} Q100 ${f1(ey + 2.4)} ${f1(100 + rx - 1.2)} ${ey}`, '#5a4028', .5, ' opacity=".2"');
  s += `<path d="${headD(g)}" fill="none" stroke="#5a4028" stroke-opacity=".3" stroke-width=".7"/>`;
  return s;
}

/* --- 신발 (ACC가 신발이면 그 색, 아니면 colors[3]의 어두운 톤 기본 신발) --- */
function avShoes(g, accS, color) {
  /* 정면에서 본 신발: 발목에서 시작해 발끝으로 갈수록 넓어졌다가 둥글게 닫히고, 바깥쪽으로 8도 벌어져 있다.
     윗부분은 바지 밑단 아래에 숨고, 밑창은 아래쪽 가장자리에만 얇게 둔다. */
  const k = g.T.foot / 30, isShoe = ['sneakers', 'boots', 'loafers'].includes(accS);
  const base = isShoe ? color : shade(color, -.22), sole = accS === 'sneakers' ? '#f3efe6' : shade(base, -.42);
  const top = g.A.ankleL.y + .9, aw = g.T.anW / 2 + 1.3, fw = 7.8 * k, ang = 8 * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang), V = .8;
  let s = '';
  for (const sg of [-1, 1]) {
    const cx = 100 + sg * (g.T.legC[1] + .6), y0 = top, sn = sg * sa;
    const P = (u, v) => f1(cx + u * ca + v * V * sn) + ' ' + f1(y0 + v * V * ca - u * sn);
    if (accS === 'boots') s += fil(`M${P(-aw + .8, -13)} L${P(aw - .8, -13)} L${P(aw - .8, 4)} L${P(-aw + .8, 4)}Z`, base, 1) + ov(`M${P(aw * .3, -13)} L${P(aw - .8, -13)} L${P(aw - .8, 4)} L${P(aw * .3, 4)}Z`, .1) + stk(`M${P(-aw, -9)} L${P(aw, -9)}`, shade(base, .25), .8, ' opacity=".6"');
    const d = `M${P(-aw, 0)} L${P(aw, 0)} C${P(aw + .5, 7)} ${P(fw + 1.6, 12)} ${P(fw + .8, 20)} C${P(fw + .2, 25.5)} ${P(fw - 3, 27.5)} ${P(0, 27.5)} C${P(-fw + 3, 27.5)} ${P(-fw - .2, 25.5)} ${P(-fw - .8, 20)} C${P(-fw - 1.6, 12)} ${P(-aw - .5, 7)} ${P(-aw, 0)}Z`;
    s += fil(d, base, 1) + ov(`M${P(aw * .2, 0)} L${P(aw, 0)} C${P(aw + .5, 7)} ${P(fw + 1.6, 12)} ${P(fw + .8, 20)} C${P(fw + .2, 25.5)} ${P(fw - 3, 27.5)} ${P(aw * .2, 27.3)}Z`, .12);
    s += stk(`M${P(-fw - .2, 23)} C${P(-fw + .4, 26.4)} ${P(-fw + 3, 27.6)} ${P(0, 27.6)} C${P(fw - 3, 27.6)} ${P(fw - .4, 26.4)} ${P(fw + .2, 23)}`, sole, 1.7);
    s += `<ellipse cx="${f1(cx - 2.4 * k)}" cy="${f1(y0 + 11.5)}" rx="1.5" ry="3.6" fill="#fff" opacity=".2"/>`;
    if (accS === 'sneakers') s += stk(`M${P(-fw + 1.2, 17)} Q${P(0, 13.6)} ${P(fw - 1.2, 17)}`, '#f3efe6', .9) + stk(`M${P(-3.4 * k, 6)} L${P(3.4 * k, 6)} M${P(-3.6 * k, 9.6)} L${P(3.6 * k, 9.6)}`, '#f3efe6', .9);
    else if (accS === 'loafers') s += stk(`M${P(-4.6 * k, 10)} Q${P(0, 12.6)} ${P(4.6 * k, 10)}`, shade(base, .32), .9) + stk(`M${P(-fw + 1, 16)} Q${P(0, 13)} ${P(fw - 1, 16)}`, shade(base, -.25), .7, ' opacity=".7"');
    else s += stk(`M${P(-fw + 1, 17)} Q${P(0, 14.5)} ${P(fw - 1, 17)}`, shade(base, -.25), .7, ' opacity=".6"');
  }
  return s;
}




/* --- 소매 (팔 랜드마크를 따라 팔 폭 + 여유) --- */
function sleeve(g, sg, endY, ea, color, o = {}) {
  /* 소매는 어깨 anchor 높이에서 시작한다. 바깥선은 몸통 어깨 끝점(tip)에서 출발해 24px 안에 자연 소매 폭으로 이어진다.
     그래서 어깨선 위로 튀어나오는 캡도, 어깨 끝과 소매 사이의 턱도 생기지 않는다. */
  const y0 = g.A.shoulderR.y;
  const off = y => (o.out || 0) * Math.min(1, Math.max(0, (y - y0) / 60));
  const c = y => 100 + sg * (g.armC(y) + off(y)), hw = y => g.armW(y) / 2 + ea;
  const tipGap = o.tip != null ? Math.max(0, o.tip - (g.armC(y0) + hw(y0))) : 0;
  const ex = y => Math.max(0, tipGap * (1 - (y - y0) / 24));
  const fl = y => c(y) - hw(y) - (sg < 0 ? ex(y) : 0), fr = y => c(y) + hw(y) + (sg > 0 ? ex(y) : 0);
  if (o.meta) { o.meta.topY = y0; o.meta.outerX = sg > 0 ? fr(y0) : 200 - fl(y0); o.meta.endY = endY; }
  let s = tube(fl, fr, y0, endY, color, { bulge: 1.5 });
  /* 주름은 팔꿈치 안쪽 한 줄과 소매 끝 박음질뿐 */
  if (endY > 190) { const ey = g.A.elbowR.y; s += stk(`M${f1(fl(ey) + 3)} ${ey + 1} Q${f1(c(ey))} ${ey + 4} ${f1(fr(ey) - 3)} ${ey + 1}`, shade(color, -.24), .6, ' opacity=".45"') + stk(`M${f1(fl(ey - 6) + 4)} ${ey - 5} Q${f1(c(ey - 6) - sg * 1)} ${ey - 2.6} ${f1(fr(ey - 6) - 5)} ${ey - 5}`, shade(color, -.24), .55, ' opacity=".28"'); }
  if (o.rib) s += band(fl, fr, endY - o.rib, endY, shade(color, -.14)) + stk(`M${f1(fl(endY - o.rib) + .5)} ${endY - o.rib} L${f1(fr(endY - o.rib) - .5)} ${endY - o.rib}`, shade(color, -.3), .5, ' opacity=".5"');
  else if (o.cuff) s += band(fl, fr, endY - o.cuff, endY, shade(color, -.08)) + stk(`M${f1(fl(endY - o.cuff) + .5)} ${endY - o.cuff} L${f1(fr(endY - o.cuff) - .5)} ${endY - o.cuff}`, shade(color, -.3), .5, ' opacity=".5"');
  else s += stk(`M${f1(fl(endY - 3) + 1.2)} ${endY - 3} L${f1(fr(endY - 3) - 1.2)} ${endY - 3}`, shade(color, -.28), .5, ' opacity=".4"');
  return s;
}



/* 밑단 접촉 그림자: 상의 밑단 바로 아래 3.5px. 몸통 폭 안쪽(maxHalf)까지만 그려서 배경으로 번지지 않는다 */
function hemShadow(H, hem, flat, opacity, maxHalf) {
  const half = Math.min(H(hem) - 4, maxHalf == null ? 1e9 : maxHalf), top = [], bot = [];
  if (half <= 6) return '';
  for (let i = 0; i <= 8; i++) { const t = i / 8, x = 100 - half + 2 * half * t, y = hem + (flat ? 0 : 2.5 * Math.sin(Math.PI * t)); top.push([x, y]); bot.push([x, y + 3.5]); }
  return `<path d="${PTS(top.concat(bot.reverse()))}" fill="#000" opacity="${opacity}"/>`;
}

/* 앞섶 그림자: 열린 아우터의 앞판 가장자리에서 안쪽 상의 쪽으로 3.5px */
const edgeShadow = (gapW, y0, y1) => [-1, 1].map(sg => `<path d="${PTS([[100 + sg * gapW, y0], [100 + sg * (gapW - 3.2), y0 + 3], [100 + sg * (gapW - 3.2), y1], [100 + sg * gapW, y1]])}" fill="#000" opacity=".14"/>`).join('');

/* 옷 주름: 겨드랑이 아래 한 줄, 옆구리 한 줄. 얇고 옅게 (그 밖의 곳에는 주름을 넣지 않는다) */
function garmentFolds(H, color, y0, y1) {
  const c = shade(color, -.26);
  return [-1, 1].map(sg => stk(`M${f1(100 + sg * (H(y0) - 1.5))} ${y0} q${f1(-sg * 5)} 4 ${f1(-sg * 7)} 13`, c, .6, ' opacity=".42"') + stk(`M${f1(100 + sg * (H(y1) - 1))} ${y1} q${f1(-sg * 2.5)} 5 ${f1(-sg * 3.5)} 12`, c, .55, ' opacity=".3"')).join('');
}


/* --- 목 주변 부품: 모두 목 anchor(g.A.neck.halfW)에서 시작한다 --- */
const NECK_ALLOW = { crew: 2.5, v: 3, collar: 3, turtle: 3.8, hood: 3 };   /* 목선이 목 반폭에서 벌어지는 정도 */
/* 목 기둥에 감기는 칼라(터틀넥·스탠드칼라): 위는 목 반폭+a, 아래는 +b. 위쪽 테두리는 살짝 휘어 원통처럼 보인다 */
function collarBand(g, color, a, b, y0, y1) {
  const nh = g.A.neck.halfW, xa = nh + a, xb = nh + b, ym = (y0 + y1) / 2 + 1, d = `M${100 - xa} ${y0} Q100 ${y0 + 4} ${100 + xa} ${y0} L${100 + xb} ${y1} Q100 ${y1 + 5} ${100 - xb} ${y1} Z`;
  return fil(d, shade(color, .04)) + ov(`M100 ${y0 + 2} L${100 + xa} ${y0} L${100 + xb} ${y1} Q100 ${y1 + 5} 100 ${y1 + 5}Z`, .08) + `<path d="${d}" fill="none"${edgeA(color)}/>` +
    stk(`M${100 - xa - .4} ${ym} Q100 ${ym + 5} ${100 + xa + .4} ${ym}`, shade(color, -.3), .6, ' opacity=".55"');
}

/* 셔츠 칼라: 스탠드가 목을 감싸고, 날개는 목 옆(y=57)에서 시작해 바깥 끝점으로 벌어졌다가 앞 중앙(단추 위)으로 모인다 */
function shirtFlaps(g, fill, stroke, scale, frontX) {
  /* 셔츠 칼라 (참고 사진 실측 비율): 잎은 몸판 위에 얹힌다. 뒤쪽 위 모서리(목 옆, 턱 아래)에서 시작해
     바깥쪽 아래 끝점(위 모서리보다 약 23px 아래, 목 중심에서 약 22px)으로 벌어지고, 끝점에서 앞 중앙 단추 자리로 이어진다.
     안쪽 접힘선이 목을 감싸고 그 사이에 V자로 목이 보인다. scale은 아우터용 큰 칼라, frontX는 아우터 앞섶 위치. */
  const nh = g.A.neck.halfW, s = scale || 1, fx = frontX == null ? 1.8 : frontX, dk = shade(fill, -.3);
  const S1 = [nh + 2.4, 57.5], T = [nh + 12.4 * s, 80.4 + 6 * (s - 1)], F = [fx, 86 + 13 * (s - 1)];
  return [-1, 1].map(sg => {
    const X = v => f1(100 + sg * v), P = p => X(p[0]) + ' ' + f1(p[1]);
    const d = `M${P(S1)} Q${X(nh + 9.4 * s)} ${f1(63.5 + 3 * (s - 1))} ${P(T)} Q${X(nh * .95 + fx * .4)} ${f1(F[1] + 1.4)} ${P(F)} Q${X(nh - .6)} ${f1(70 + 6 * (s - 1))} ${P(S1)}Z`;
    const cast = ov(`M${P(T)} Q${X(nh * .95 + fx * .4)} ${f1(F[1] + 1.4)} ${P(F)} L${X(F[0] + .8)} ${f1(F[1] + 3.2)} Q${X(nh * .95 + fx * .4 + 1)} ${f1(F[1] + 4.4)} ${X(T[0] - .6)} ${f1(T[1] + 3)}Z`, .11);
    return cast + fil(d, fill) + ov(`M${P(S1)} Q${X(nh - .6)} ${f1(70 + 6 * (s - 1))} ${P(F)} L${X(F[0] + 4)} ${f1(F[1] - 3)} Q${X(nh + 3)} 66 ${X(S1[0] + 1)} ${S1[1] + 1.6}Z`, .1) + `<path d="${d}" fill="none"${edgeA(fill)}/>` +
      stk(`M${X(S1[0] - .6)} ${S1[1] + 1.4} Q${X(nh - .4)} ${f1(70 + 6 * (s - 1))} ${X(F[0] + .8)} ${f1(F[1] - .8)}`, dk, .55, ' opacity=".5"') + stk(`M${X(S1[0] + 2)} ${S1[1] + 4} Q${X(nh + 8.6 * s)} ${f1(66 + 3 * (s - 1))} ${X(T[0] - 1.6)} ${f1(T[1] - 3.4)}`, dk, .5, ' opacity=".3"');
  }).join('');
}





/* 후드: 목 앞을 덮지 않고, 목 옆에서 어깨 뒤로 흘러내리는 두 덩이 (안쪽은 어둡게) */
function hoodLobes(g, color) {
  const nh = g.A.neck.halfW, f = shade(color, -.04);
  return [-1, 1].map(sg => { const d = `M${100 + sg * (nh + .5)} 62 C${100 + sg * (nh + 7)} 61 ${100 + sg * (nh + 15)} 67 ${100 + sg * (nh + 14.5)} 84 L${100 + sg * (nh + 1)} 79 Z`; return fil(d, f) + ov(`M${100 + sg * (nh + .5)} 62 C${100 + sg * (nh + 3)} 65 ${100 + sg * (nh + 3)} 72 ${100 + sg * (nh + 1)} 79 L${100 + sg * (nh + .5)} 62Z`, .16) + `<path d="${d}" fill="none"${edgeA(color)}/>`; }).join('');
}


/* --- 상의 --- */
function torsoTop(g, e, hem, color, nk, sleeveless, flat) {
  const H = y => g.torso(y) + e;
  let sh = shoulderPts(nk.nw, H(80));
  let armhole = [];
  if (sleeveless) {
    /* 끈 바깥 모서리는 다른 상의와 같은 공통 어깨 경사선 위의 점이다 (아우터 어깨선 밖으로 나오지 않는다) */
    const a = nk.nw + 14, base = sh, k = base.findIndex(p => p[0] >= a);
    const yAt = k <= 0 ? base[0][1] : base[k - 1][1] + (base[k][1] - base[k - 1][1]) * (a - base[k - 1][0]) / (base[k][0] - base[k - 1][0]);
    sh = base.filter(p => p[0] < a).concat([[a, yAt]]);
    const ya = sh[sh.length - 1][1];
    armhole = rng(76, 112, 6).map(y => { const t = Math.max(0, (y - ya) / (112 - ya)); return [a + (H(112) - a) * t * t, y]; });
  }
  const y1 = sleeveless ? 118 : 84, ysd = rng(y1, hem, 5);
  const side = sg => sh.map(p => [100 + sg * p[0], p[1]]).concat(armhole.map(p => [100 + sg * p[0], p[1]]), ysd.map(y => [100 + sg * H(y), y]));
  const bot = [];
  for (let i = 1; i < 4; i++) bot.push([100 - H(hem) + 2 * H(hem) * i / 4, hem + (flat ? 0 : 2.5 * Math.sin(Math.PI * i / 4))]);
  const d = PTS(side(-1).concat(bot, side(1).reverse(), neckline(nk.nw, nk.depth, nk.v)));
  const ys = rng(y1, hem, 5), fl = y => 100 - H(y), fr = y => 100 + H(y);
  return { d, H, svg: fil(d, color) + formShade(fl, fr, ys) + hemInner(100 - H(hem) + .6, 100 + H(hem) - .6, hem, flat ? 0 : 2.5) + `<path d="${d}" fill="none"${edgeA(color)}/>` };
}

function wearTop(shape, color, g, o = {}) {
  const c = AV_CFG.top[shape] || AV_CFG.top.tshirt_short;
  const dk = shade(color, -.24), lt = shade(color, .16), ln = shade(color, -.26);
  const hem = o.tucked ? g.A.waist.y + 2 : (c.rib ? g.A.hip.y - 2 : g.A.hip.y - 8);
  const nk = { nw: g.A.neck.halfW + NECK_ALLOW[c.neck], depth: { crew: 9, v: 24, collar: 18, turtle: 2, hood: 10 }[c.neck], v: c.neck === 'v' || c.neck === 'collar' };
  let s = '';
  if (c.neck === 'hood') s += hoodLobes(g, color);
  const tor = torsoTop(g, c.e, hem, color, nk, shape === 'sleeveless', !!o.tucked);
  s += hemShadow(tor.H, hem, !!o.tucked, .11, g.torso(hem) + 2);
  const sm = {};
  if (shape !== 'sleeveless') for (const sg of [-1, 1]) s += sleeve(g, sg, c.sl, c.e * .6, color, { rib: c.rib, cuff: c.cuff, tip: tor.H(AV_Y.shoulder), meta: sg > 0 ? sm : null });
  if (o.meta) o.meta.top = { neckY: AV_Y.neck, nw: nk.nw, neckAllow: NECK_ALLOW[c.neck], tipX: tor.H(AV_Y.shoulder), hemY: hem, ease: c.e, tucked: !!o.tucked, sleeve: shape === 'sleeveless' ? null : sm };
  s += tor.svg;
  const H = tor.H;
  /* 어깨 솔기: 목선 옆에서 어깨 끝까지 아주 옅은 선 한 줄 */
  if (shape !== 'sleeveless') s += [-1, 1].map(sg => stk(`M${f1(100 + sg * (nk.nw + 1.5))} 69 Q${f1(100 + sg * (H(80) * .6))} 72.5 ${f1(100 + sg * (H(80) - 1.5))} 79.5`, ln, .5, ' opacity=".3"')).join('');
  if (c.rib && !o.tucked) s += band(y => 100 - H(y), y => 100 + H(y), hem - c.rib, hem, shade(color, -.14)) + stk(`M${100 - H(hem - c.rib) + .5} ${hem - c.rib} L${100 + H(hem - c.rib) - .5} ${hem - c.rib}`, ln, .5, ' opacity=".5"');
  switch (c.neck) {
    case 'crew': {
      const nl = neckline(nk.nw, nk.depth, false).reverse().map(p => `L${f1(p[0])} ${f1(p[1])}`).join('');
      s += stk(`M${100 - nk.nw} 68 ${nl}L${100 + nk.nw} 68`, shade(color, -.14), 2.3) + stk(`M${100 - nk.nw + 1} 69 ${neckline(nk.nw - 1, nk.depth - 1.6, false).reverse().map(p => `L${f1(p[0])} ${f1(p[1])}`).join('')}L${100 + nk.nw - 1} 69`, ln, .5, ' opacity=".4"');
      break;
    }
    case 'v':
      s += stk(`M${100 - nk.nw} 68 L100 ${68 + nk.depth} L${100 + nk.nw} 68`, shade(color, -.14), 1.7) + stk(`M${100 - nk.nw + 1.6} 69.4 L100 ${68 + nk.depth - 2.6} L${100 + nk.nw - 1.6} 69.4`, ln, .5, ' opacity=".4"');
      /* 니트 결: 밑단·소매 립에서만 세로 골을 보여 준다 (몸판 전체에 줄무늬를 넣지 않는다) */
      for (let x = -H(hem) + 3; x < H(hem) - 2; x += 3.4) s += stk(`M${f1(100 + x)} ${hem - c.rib + 1} V${hem - 1.5}`, ln, .5, ' opacity=".3"');
      break;
    case 'collar':
      s += shirtFlaps(g, lt, dk, 1);
      s += stk(`M100 86 V${hem - 3}`, ln, .6, ' opacity=".55"');
      [86, 99, 112, 125, 138, 151, 164].filter(y => y < hem - 6).forEach(y => { s += `<circle cx="100" cy="${y}" r="1.15" fill="${lt}" stroke="${ln}" stroke-opacity=".6" stroke-width=".5"/>`; });
      break;
    case 'turtle': s += collarBand(g, color, 1.8, 3.8, 55, 70); break;
    case 'hood':
      s += stk(`M94.5 78 Q93 90 94 104`, lt, 1.1) + stk(`M105.5 78 Q107 90 106 104`, lt, 1.1) + dot(94, 105, 1.2, lt) + dot(106, 105, 1.2, lt);
      s += fil(`M${100 - H(150) + 9} 152 L${100 + H(150) - 9} 152 L${100 + H(186) - 5} 190 Q100 193 ${100 - H(186) + 5} 190 Z`, shade(color, -.05), 1) + ov(`M${100 + 4} 152 L${100 + H(150) - 9} 152 L${100 + H(186) - 5} 190 Q${100 + 4} 192 ${100 + 4} 190Z`, .06);
      s += stk(`M${100 - H(150) + 9} 152 L${100 - H(186) + 12} 172 M${100 + H(150) - 9} 152 L${100 + H(186) - 12} 172`, ln, .6, ' opacity=".55"'); break;
  }
  if (shape === 'sweatshirt') s += stk(`M${100 - nk.nw - 1} 70 Q100 ${68 + nk.depth + 2.4} ${100 + nk.nw + 1} 70`, ln, .5, ' opacity=".3"');
  if (shape !== 'sleeveless') s += garmentFolds(H, color, 104, 142);
  return s;
}


/* --- 하의 --- */
function wearBottom(shape, color, g, o = {}) {
  const c = AV_CFG.bottom[shape] || AV_CFG.bottom.jeans, hem = c.hem;
  const fitPts = [[g.A.waist.y, c.fit[0]], [g.A.hip.y, c.fit[1]], [Math.min(AV_Y.crotch + 28, hem - 6), c.fit[2]], [Math.min(AV_Y.knee, hem - 2), c.fit[3]], [hem, c.fit[4]]].filter((p, i, a) => i === 0 || p[0] > a[i - 1][0]);
  const e = y => ipol(fitPts, y);   /* 구간별 여유 (허리 → 골반 → 허벅지 → 무릎 → 밑단) */
  const lo = y => y < AV_Y.crotch ? g.torso(y) + e(y) : g.legC(y) + g.legW(y) / 2 + e(y);
  const li = y => Math.max(.6, g.legC(y) - g.legW(y) / 2 - e(y) * .5);
  const yo = rng(g.A.waist.y - 2, hem, 5), yi = rng(AV_Y.crotch + 4, hem, 5);
  const leg = sg => ({ out: yo.map(y => [100 + sg * lo(y), y]), inn: yi.map(y => [100 + sg * li(y), y]) });
  const A = leg(-1), B = leg(1);
  const hemMid = sg => [1, 2, 3].map(i => [100 + sg * (lo(hem) + (li(hem) - lo(hem)) * i / 4), hem + 1.6 * Math.sin(Math.PI * i / 4)]);
  const d = PTS(A.out.concat(hemMid(-1), A.inn.slice().reverse(), [[100, AV_Y.crotch + 3]], B.inn, hemMid(1).reverse(), B.out.slice().reverse()));
  const dk = shade(color, -.26);
  let s = `<path d="${d}" fill="${color}"/>`;
  /* 다리마다 형태를 따라가는 명암 (광원은 왼쪽 위: 각 다리의 오른쪽 면이 어둡다) */
  for (const sg of [-1, 1]) {
    const ys = rng(AV_Y.crotch, hem, 5), xo = y => 100 + sg * lo(y), xi = y => 100 + sg * li(y);
    s += formShade(sg < 0 ? xo : xi, sg < 0 ? xi : xo, ys, { dark: .08, light: .1, a: .8 });
    s += hemInner(Math.min(xo(hem), xi(hem)) + .6, Math.max(xo(hem), xi(hem)) - .6, hem, 1.6, .08, 4);
  }
  s += `<path d="${d}" fill="none"${edgeA(color)}/>`;
  /* 허리밴드 */
  s += tube(y => 100 - lo(y), y => 100 + lo(y), 166, 176, shade(color, -.1), { flat: true, bulge: 0, step: 4 });
  s += stk(`M${100 - lo(166) + 1} 176 L${100 + lo(176) - 1} 176`, dk, .55, ' opacity=".5"');
  if (shape === 'jeans' || shape === 'slacks') {

async function fetchJSON(url, ms = 10000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const forecastUrl = c => 'https://api.open-meteo.com/v1/forecast?latitude=' + c.lat + '&longitude=' + c.lon +
  '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day' +
  '&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,precipitation_probability,weather_code,is_day' +
  '&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,weather_code,precipitation_probability_max' +

async function loadCity(city) {
  const token = ++state.reqId;
  showLoader(true);
  try {
    const parsed = parseForecast(await fetchJSON(forecastUrl(city)));
    if (token !== state.reqId) return;

/* 현재 위치 (Geolocation + BigDataCloud 리버스 지오코딩) */
function locate() {
  if (!navigator.geolocation) { toast('이 브라우저는 위치 기능을 지원하지 않아요. 도시를 검색해 주세요'); $('#citySearch').focus(); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    let name = '현재 위치';
    showLoader(true);
    try {
      const j = await fetchJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=ko', 8000);
      name = j.city || j.locality || j.principalSubdivision || '현재 위치';
    } catch (e) { /* 도시명만 실패 — 날씨는 정상 표시 */ }
    showLoader(false);
    loadCity({ name, lat, lon });
  }, () => {
    toast('위치 권한을 확인할 수 없어요. 도시를 검색해 주세요');
    $('#citySearch').focus();
  }, { timeout: 10000, maximumAge: 600000 });
}

/* ---------- 자동완성 ---------- */
const sug = { items: [], active: -1, seq: 0, timer: null, loading: false };
const GEO_OK = new Set(['PPLC', 'PPLA', 'PPLA2', 'PPLA3']);
const GEO_BAD = /(?:\b(?:zan|hill|peak|mt|mount|mountain)\b|-ri\b)/i;
function filterGeo(results, q) {
  const k = norm(q);
  return results
    .filter(r => r.country_code !== 'KP')
    .filter(r => GEO_OK.has(r.feature_code) || (r.feature_code === 'PPL' && (r.population || 0) >= 50000))
    .filter(r => !GEO_BAD.test(r.name || ''))
    .sort((a, b) => {
      const ea = norm(a.name) === k ? 0 : 1, eb = norm(b.name) === k ? 0 : 1;
      if (ea !== eb) return ea - eb;
      const ka = a.country_code === 'KR' ? 0 : 1, kb = b.country_code === 'KR' ? 0 : 1;
      if (ka !== kb) return ka - kb;
      const ca = a.feature_code === 'PPLC' ? 0 : 1, cb = b.feature_code === 'PPLC' ? 0 : 1;
      if (ca !== cb) return ca - cb;
      return (b.population || 0) - (a.population || 0);
    })
    .map(r => ({ name: r.name, sub: [r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude }));
}
function renderSug() {
  const input = $('#citySearch'), ul = $('#citySuggestions');
  let html = sug.items.map((c, i) => `<li role="option" id="sug-${i}" data-i="${i}" aria-selected="${i === sug.active}" class="${i === sug.active ? 'active' : ''}"><span class="n">${esc(c.name)}</span><span class="s">${esc(c.sub || '')}</span></li>`).join('');
  if (sug.loading) html += '<li class="hint" role="presentation">검색 중…</li>';
  else if (!sug.items.length) html = '<li class="hint" role="presentation">결과가 없어요</li>';
  ul.innerHTML = html;
  ul.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  if (sug.active >= 0) input.setAttribute('aria-activedescendant', 'sug-' + sug.active); else input.removeAttribute('aria-activedescendant');
}
function closeSug() {
  sug.seq++; clearTimeout(sug.timer); sug.loading = false; sug.active = -1;
  $('#citySuggestions').hidden = true;
  const input = $('#citySearch');
  input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant');
}
function chooseSug(i) {
  const c = sug.items[i];
  if (!c) return;
  closeSug();
  $('#citySearch').value = c.name;
  loadCity({ name: c.name, lat: c.lat, lon: c.lon });
}
async function remoteSearch(q, seq, presets) {
  try {
    const j = await fetchJSON('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q) + '&count=10&language=ko&format=json', 8000);
    if (seq !== sug.seq) return;
    const ext = filterGeo(j.results || [], q).filter(e => !presets.some(p => p.name === e.name || (Math.abs(p.lat - e.lat) < .3 && Math.abs(p.lon - e.lon) < .3)));
    sug.items = presets.concat(ext).slice(0, 6);
  } catch (e) { /* 프리셋 결과만 유지 */ }
  if (seq === sug.seq) { sug.loading = false; renderSug(); }
}
function onSearchInput() {
  const q = $('#citySearch').value.trim();
  clearTimeout(sug.timer);
  const seq = ++sug.seq;
  if (!q) { closeSug(); return; }
  const presets = matchPresets(q).slice(0, 6);
  sug.items = presets; sug.active = -1;
  sug.loading = presets.length < 6;
  renderSug();
  if (sug.loading) sug.timer = setTimeout(() => remoteSearch(q, seq, presets), 300);
}
function initSearch() {
  const input = $('#citySearch'), ul = $('#citySuggestions');
  input.addEventListener('input', onSearchInput);
  input.addEventListener('focus', () => { input.select(); });
  input.addEventListener('keydown', e => {
    const open = !ul.hidden;
    if (e.key === 'ArrowDown' && open && sug.items.length) { e.preventDefault(); sug.active = (sug.active + 1) % sug.items.length; renderSug(); }
    else if (e.key === 'ArrowUp' && open && sug.items.length) { e.preventDefault(); sug.active = sug.active <= 0 ? sug.items.length - 1 : sug.active - 1; renderSug(); }
    else if (e.key === 'Enter' && open) { e.preventDefault(); if (sug.items.length) chooseSug(sug.active >= 0 ? sug.active : 0); }
    else if (e.key === 'Escape' && open) { e.preventDefault(); closeSug(); }
  });
  ul.addEventListener('mousedown', e => { const li = e.target.closest('li[role=option]'); if (li) { e.preventDefault(); chooseSug(+li.dataset.i); } });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) { if (!ul.hidden) closeSug(); } });
}

function renderWeek() {
